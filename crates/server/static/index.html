<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTTP</title>

    <script>
        // Connect back to the server that served this page, whatever its
        // host and port are (native 127.0.0.1:8000, container 127.0.0.1:8080,
        // or a remote deployment). ws:// on http pages, wss:// on https pages.
        const wsScheme = location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${wsScheme}//${location.host}/`);
        socket.onopen = () => {
            console.log("Connected");
            socket.send("Hello, Rust!");
        };
        socket.onmessage = (e) => console.log("Received:", e.data);
        socket.onerror = (e) => console.error("WebSocket error:", e);
        socket.onclose = (e) => console.log("Connection closed:", e.code, e.reason);
    </script>
</head>
<body>
<h1>Testing...</h1>
</body>
</html>
