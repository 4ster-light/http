[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Shared dependency versions. Member crates inherit via `dep.workspace = true`
# and enable only the tokio features they need.
[workspace.dependencies]
# Workspace members
http = { path = "crates/http", version = "0.1.0" }
websocket = { path = "crates/websocket", version = "0.1.0" }

# External crates
base64 = "0.22.1"
bytes = "1.10.1"
httpdate = "1.0"
sha1 = "0.10.6"
thiserror = "2.0.17"
tokio = { version = "1.47.1", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Lint infrastructure (G1). Ratcheting plan per REFACTOR-PLAN.md:
# `missing_docs` turns on in Phase 2 (docs/), clippy pedantic review in Phase 5.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
